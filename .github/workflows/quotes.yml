name: quotes

on:
  schedule:
    # 台股盤中 09:00-13:30 Taipei = 01:00-05:30 UTC
    - cron: "*/5 1-5 * * 1-5"
    # 美股盤前+盤中+盤後 (04:00-20:00 ET; 涵蓋夏令/冬令) = 08:00-24:00 UTC
    - cron: "*/5 8-23 * * 1-5"
    - cron: "*/5 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch quotes
        run: python3 scripts/fetch.py

      - name: Publish to data branch (single force-pushed commit, no history bloat)
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -q -m "quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
